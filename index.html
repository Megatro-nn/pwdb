<style>

  --accbg:rgba(167,139,250,.18);
  --r:12px; --tab:64px;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f6f2fb; --bg2:#ffffff; --bg3:#ece5f7; --bg4:#ddd2ee;
    --sep:rgba(88,60,140,.16); --txt:#1a1320; --txt2:rgba(40,25,60,.62); --txt3:rgba(40,25,60,.38);
    --blue:#7c3aed; --pink:#db2777; --green:#16a34a; --orange:#d97706;
    --accbg:rgba(124,58,237,.12);
  }
}
:root[data-theme="light"]{
  --bg:#f6f2fb; --bg2:#ffffff; --bg3:#ece5f7; --bg4:#ddd2ee;
  --sep:rgba(88,60,140,.16); --txt:#1a1320; --txt2:rgba(40,25,60,.62); --txt3:rgba(40,25,60,.38);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}

.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}

function errCard(e){
  const code = e?.code || (e?.status ? 'HTTP ' + e.status : 'NETWORK');
  let hint = '';
  if (code === 'MISSING_API_KEY' || code === 'INVALID_API_KEY') hint = 'Check your API key in Settings.';
  else if (code === 'RATE_LIMITED' || code === 'MUTATION_RATE_LIMITED') hint = 'Slow down and retry in a moment.';
  else if (code === 'NETWORK') hint = 'Could not reach the API. Point the base URL at your proxy in Settings.';
  return `<div class="err"><b>${esc(code)}</b>${esc(e?.message || 'Request failed')}${hint ? '<br>' + esc(hint) : ''}</div>`;
}

const memCache = new Map();

async function api(path, opts = {}){
  const url = new URL(K.base + path);
  for (const k in (opts.params || {})){
    const v = opts.params[k];
    if (v === undefined || v === null || v === '') continue;
    if (Array.isArray(v)) v.forEach(x => url.searchParams.append(k, x));
    else url.searchParams.set(k, String(v));
  }
  const headers = Object.assign({}, opts.headers || {});
  if (K.key) headers['X-API-Key'] = K.key;

  const method = opts.method || 'GET';
  let cKey = null, cached = null;
  if (method === 'GET'){
    cKey = url.href;
    cached = memCache.get(cKey) || null;
    if (!cached){ try { cached = JSON.parse(localStorage.getItem('pwdb.c:' + cKey) || 'null'); } catch {} }
    if (cached?.etag) headers['If-None-Match'] = cached.etag;
  }

  let res;
  try {
    res = await fetch(url.href, { method, headers,
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined });
  } catch { const e = new Error('Network request failed'); e.code = 'NETWORK'; throw e; }

  if (res.status === 304 && cached) return cached.body;

  const text = await res.text();
  let body = null;
  if (text){ try { body = JSON.parse(text); } catch { body = { error: text.slice(0, 300) }; } }

  if (!res.ok){
    const err = new Error(body?.error || res.statusText || 'HTTP ' + res.status);
    err.status = res.status; err.code = body?.code || 'HTTP_' + res.status; throw err;
  }

  if (cKey && body){
    const etag = res.headers.get('ETag');
    if (etag){
      const rec = { etag, body };
      memCache.set(cKey, rec);
      try {
        localStorage.setItem('pwdb.c:' + cKey, JSON.stringify(rec));
        if (localStorage.length > 220){
          for (const k of Object.keys(localStorage)) if (k.startsWith('pwdb.c:')) { localStorage.removeItem(k); break; }
        }
      } catch {}
    }
  }
  return body;
}

function nextPayload(html){
  const out = [];
  const re = /self\.__next_f\.push\(\[1,("(?:[^"\\]|\\.)*")\]\)/g;
  let m;
  while ((m = re.exec(html))) { try { out.push(JSON.parse(m[1])); } catch {} }
  return out.join('');
}

function jsonAfter(src, key){
  const i = src.indexOf('"' + key + '":');
  if (i < 0) return null;
  const j = src.indexOf('{', i);
  if (j < 0) return null;
  let depth = 0, inStr = false, escp = false;
  for (let k = j; k < src.length; k++){
    const ch = src[k];
    if (inStr){
      if (escp) escp = false;
      else if (ch === '\\') escp = true;
      else if (ch === '"') inStr = false;
      continue;
    }
    if (ch === '"') { inStr = true; continue; }
    if (ch === '{') depth++;
    else if (ch === '}'){ depth--; if (!depth){ try { return JSON.parse(src.slice(j, k + 1)); } catch { return null; } } }
  }
  return null;
}

async function siteFetch(path){
  const base = K.proxy || SITE;

function pager(target, fetchFn, renderFn, emptyHtml = '<div class="empty">Nothing here yet.</div>'){
  const list = document.createElement('div');
  target.appendChild(list);
  const more = document.createElement('button');
  more.className = 'loadmore'; more.textContent = 'Load more';
  target.appendChild(more);

  let p = 1, loading = false, done = false;
  const step = async () => {
    if (loading || done) return;
    loading = true; more.textContent = 'Loading…';
    try {
      const res = await fetchFn(p);
      const items = res?.data ?? [];
      items.forEach(it => { if (it) list.appendChild(renderFn(it)); });
      if (!items.length && p === 1) list.innerHTML = emptyHtml;
      done = !res?.pagination?.hasMore || p >= 1000;
      p++;
    } catch (e){
      list.insertAdjacentHTML('beforeend', errCard(e));
      done = true;
    }
    loading = false;
    if (done) more.remove(); else more.textContent = 'Load more';
  };
  more.onclick = step;
  const io = new IntersectionObserver(en => { if (en[0].isIntersecting) step(); }, { rootMargin: '700px' });
  io.observe(more);
  step();
  return { list };
}

      return `<div class="scene">
        <div class="bookmark">${ICO.bookmark}</div>
        <div class="sbody">
          <div class="shead">
            <span class="chlab">CH.</span><span class="chnum">${label}</span>
            ${cnt ? `<button class="chcount" data-ch="${c.chapterStart}">${ICO.img}${cnt}</button>` : ''}

          ${(c.characters || []).length ? `<div class="schars">${c.characters.map(x => `<a class="schar" href="#/character/${x.id}">
            <img src="${esc(img(x.image))}" onerror="this.onerror=null;this.src='${PH}'">${esc(x.name)}</a>`).join('')}</div>` : ''}
        </div>
        <a class="reader" href="${sceneUrl(d, c)}" target="_blank" rel="noopener">${ICO.play}</a>

    box.querySelectorAll('.chcount').forEach(b => b.onclick = () => show('gallery'));
  }

  const drawOverview = () => {
    body.innerHTML = `
      ${(d.alternativeTitles || []).length ? `<div class="desc">${esc(d.alternativeTitles.join(' · '))}</div>` : ''}
      <div class="tagline">${(d.genreTags || []).map(t => `<a class="chip" href="#/browse?tags=${encodeURIComponent(t)}">${esc(t)}</a>`).join('')}
        ${(d.externalLinks || []).map(l => `<a class="chip blue" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.siteName)}</a>`).join('')}</div>
      ${d.description ? `<div class="desc clamp" id="desc">${esc(d.description)}</div><button class="more-btn" id="more">More</button>` : ''}
      <div class="stats-strip">
        <div class="stat"><b>${d.totalChapters ?? '—'}</b><span>Chapters</span></div>
        <div class="stat"><b>${d.totalRatings ?? 0}</b><span>Ratings</span></div>
        <div class="stat"><b>${(d.characters || []).length}</b><span>Characters</span></div>
      </div>
      ${(d.creators || []).length ? `<div class="sec"><div class="sec-h"><h2>Creators</h2></div>
        <div class="rows">${d.creators.map(c => `<a class="row" href="#/creator/${c.id}">
          <div class="rmain"><div class="rtitle">${esc(c.canonicalName)}</div>
          <div class="rsub">${esc(c.role)}${(c.aliases || []).length ? ' · ' + esc(c.aliases.join(', ')) : ''}</div></div></a>`).join('')}</div></div>` : ''}

      <div class="rows" id="scenes"></div>`;

    const m = $('#more');
    if (m) m.onclick = () => { $('#desc').classList.toggle('clamp'); m.textContent = $('#desc').classList.contains('clamp') ? 'More' : 'Less'; };
    wirePair(); renderScenes();
  };

  const drawCharacters = () => {
    body.innerHTML = (d.characters || []).length
      ? `${pairBlock()}<div class="sec"><div class="sec-h"><h2>All characters</h2></div></div>
         <div class="avgrid">${d.characters.map(c => `<a class="avcard" href="#/character/${c.id}">
           <img src="${esc(img(c.image))}" onerror="this.onerror=null;this.src='${PH}'"><span>${esc(c.name)}</span></a>`).join('')}</div>
         <div class="rows" id="scenes" style="margin-top:16px"></div>`
      : '<div class="empty">No characters recorded.</div>';
    if ((d.characters || []).length) { wirePair(); renderScenes(); }
  };

  const drawRelated = () => {
    body.innerHTML = '<div class="spin"></div>';
    api('/pornhwa/' + encodeURIComponent(d.slug) + '/similar', { params: { limit: 24 } })
      .then(r => {
        const list = r.data || [];
        body.innerHTML = list.length
          ? `<div class="pad"><div class="grid">${list.map(seriesCard).join('')}</div></div>`
          : '<div class="empty">No related works.</div>';
      }).catch(e => body.innerHTML = errCard(e));
  };

  const drawReviews = () => {
    body.innerHTML = '<div class="pad" id="rhost"></div>';
    pager($('#rhost'), p => api('/pornhwa/' + encodeURIComponent(d.slug) + '/reviews', { params: { page: p, limit: 20 } }), rv => {
      const w = document.createElement('div');
      w.className = 'rows'; w.style.margin = '0 0 10px';
      w.innerHTML = `<div class="row"><div class="rmain">
        <div class="rtitle">${esc(rv.userDisplayName || 'Anonymous')} ${rv.userRating != null ? '<span class="star">★</span> ' + rv.userRating : ''}</div>
        <div class="rsub" style="white-space:normal">${esc(rv.reviewText)}</div>
        <div class="rsub">${when(rv.createdAt)}</div></div></div>`;
      return w;
    }, '<div class="empty">No reviews yet.</div>');
  };

  const drawGallery = async () => {
    body.innerHTML = '<div class="spin"></div>';
    let panels = [];
    try {
      const html = await siteFetch(`/pornhwa/${d.id}/${encodeURIComponent(d.slug)}/gallery`);
      const g = jsonAfter(nextPayload(html), 'initialGalleryPage');
      panels = g?.panels || [];
      galleryCounts = {};
      panels.forEach(p => { const k = p.chapter_start ?? p.gallery_chapter_number; if (k) galleryCounts[k] = (galleryCounts[k] || 0) + 1; });
    } catch (e) {
      body.innerHTML = `<div class="err"><b>GALLERY UNAVAILABLE</b>${esc(e.message)}<br>
        The gallery is not in the API, so it is read from the site page. If this keeps failing, set a site proxy in Settings.</div>
        <div class="pad"><a class="btn primary" style="display:block;text-align:center" href="${site}/gallery" target="_blank">Open gallery on site</a></div>`;
      return;
    }
    if (!panels.length){ body.innerHTML = '<div class="empty">No gallery images yet.</div>'; return; }

    body.innerHTML = `<div class="pad" style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:13px;color:var(--txt2)">${panels.length} panels</span>

      <div class="masonry" id="gal"></div>`;

    $('#gal').innerHTML = panels.map(p => {
      const s = p.chapter_start ?? p.gallery_chapter_number;
      const e = p.chapter_end;
      const lab = s ? (e && e !== s ? `Ch. ${s}–${e}` : `Ch. ${s}`) : 'Ch. ?';
      const ar = parseFloat(p.aspect_ratio) || 0.5;
      return `<a class="panel" data-full="${esc(p.image_path)}" data-lab="${esc(lab)}" style="aspect-ratio:${ar}/1">
        <img loading="lazy" src="${esc(p.thumbnail_path || p.image_path)}" onerror="this.onerror=null;this.src='${PH}'">
        ${p.total_likes ? `<span class="likes">♥ ${p.total_likes}</span>` : ''}
        <span class="chbadge">${esc(lab)}${e && e !== s ? '<i>?</i>' : ''}</span></a>`;
    }).join('');

    $('#gal').querySelectorAll('.panel').forEach(a => a.onclick = () => lightbox(a.dataset.full, a.dataset.lab));
  };

  const drawStats = async () => {
    body.innerHTML = '<div class="spin"></div>';
    try {
      const { data } = await api('/pornhwa/' + encodeURIComponent(d.slug) + '/ratings');
      const dist = data.ratingDistribution || {};
      const total = data.totalRatings || 0;
      body.innerHTML = `
        <div class="stats-strip">
          <div class="stat"><b>${data.averageRating != null ? data.averageRating.toFixed(2) : '—'}</b><span>Average</span></div>
          <div class="stat"><b>${total}</b><span>Ratings</span></div>
          <div class="stat"><b>${d.totalChapters ?? '—'}</b><span>Chapters</span></div>
        </div>
        <div class="sec-h" style="padding:14px 16px 8px"><h2 style="font-size:16px">Rating distribution</h2></div>
        <div class="dist">${['5','4.5','4','3.5','3','2.5','2','1.5','1','0.5'].map(k => {
          const n = dist[k] || 0, pct = total ? (n / total) * 100 : 0;
          return `<div class="distrow"><span style="width:26px">${k}</span>
            <span class="dbar"><span class="dfill" style="width:${pct}%"></span></span>
            <span style="width:28px;text-align:right">${n}</span></div>`;
        }).join('')}</div>
        <div class="pad"><div class="rows"><div class="row"><div class="rmain">
          <div class="rtitle">Views &amp; activity</div><div class="rsub">Full statistics live on the site.</div></div>
          <a class="rright" href="${site}?tab=stats" target="_blank">Open</a></div></div></div>`;
    } catch (e){ body.innerHTML = errCard(e); }
  };

  const drawLog = () => {
    body.innerHTML = `<div class="pad"><div class="rows"><div class="row"><div class="rmain">
      <div class="rtitle">Edit Log</div><div class="rsub">Not exposed by the API. Open the site to read it.</div></div>
      <a class="rright" href="${site}?tab=editLog" target="_blank">Open</a></div></div></div>`;
  };

  const draws = { overview: drawOverview, characters: drawCharacters, related: drawRelated,
    reviews: drawReviews, gallery: drawGallery, stats: drawStats, log: drawLog };

  function show(t){
    [...$('#dtabs').children].forEach(b => b.classList.toggle('on', b.dataset.t === t));
    body.innerHTML = '<div class="spin"></div>';
    if (!loaded[t] || t === 'overview' || t === 'characters'){ loaded[t] = true; draws[t](); }
    else draws[t]();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  $('#dtabs').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.t); };
  show('overview');

  $('#a-fav').onclick = async () => {
    try {
      const cur = await api('/me/tracking/' + encodeURIComponent(d.slug) + '/favorite');
      if (cur.data.favorited){ await api('/me/tracking/' + encodeURIComponent(d.slug) + '/favorite', { method: 'DELETE' });
        $('#a-fav').classList.remove('on'); toast('Unfavorited'); }
      else { await api('/me/tracking/' + encodeURIComponent(d.slug) + '/favorite', { method: 'PUT' });
        $('#a-fav').classList.add('on'); toast('Favorited'); }
    } catch (e){ toast(e.code === 'NOT_FOUND' ? 'Track it first' : e.message, true); }
  };
  api('/me/tracking/' + encodeURIComponent(d.slug) + '/favorite')
    .then(r => { if (r.data.favorited) $('#a-fav').classList.add('on'); }).catch(() => {});

  $('#a-track').onclick = async () => {
    let cur = null;
    try { cur = (await api('/me/tracking/' + encodeURIComponent(d.slug))).data; } catch {}
    const opts = ['reading','completed','dropped','plan_to_read','on_hold','re_reading'];
    const { root, close } = openSheet('Tracking', `
      <div>${opts.map(s => `<button class="sheet-item ${cur?.status === s ? 'sel' : ''}" data-s="${s}">${lblStatus(s)}</button>`).join('')}</div>
      ${cur ? '<div style="margin-top:14px"><button class="btn danger" id="del">Remove from library</button></div>' : ''}
      ${cur ? `<div class="actions" style="padding:14px 0 0"><button class="btn" id="inc">+1 chapter</button><button class="btn" id="done">Mark completed</button></div>` : ''}`);
    root.querySelectorAll('.sheet-item').forEach(b => b.onclick = async () => {
      try { await api('/me/tracking/' + encodeURIComponent(d.slug), { method: 'PUT', body: { status: b.dataset.s } });
        toast('Saved'); close(); } catch (e){ toast(e.message, true); }
    });
    const del = root.querySelector('#del');
    if (del) del.onclick = async () => {
      try { await api('/me/tracking/' + encodeURIComponent(d.slug), { method: 'DELETE' }); toast('Removed'); close(); }
      catch (e){ toast(e.message, true); }
    };
    const inc = root.querySelector('#inc');
    if (inc) inc.onclick = async () => {
      try { const r = await api('/me/tracking/' + encodeURIComponent(d.slug) + '/actions/increment-chapter', { method: 'POST' });
        toast('Chapter ' + r.data.currentChapter); close(); } catch (e){ toast(e.message, true); }
    };
    const dn = root.querySelector('#done');
    if (dn) dn.onclick = async () => {
      try { await api('/me/tracking/' + encodeURIComponent(d.slug) + '/actions/mark-completed', { method: 'POST' });
        toast('Completed'); close(); } catch (e){ toast(e.message, true); }
    };
  };

  $('#a-lists').onclick = async () => {
    const { root } = openSheet('Lists', '<div class="spin" style="margin:20px auto"></div>');
    try {
      const me = (await api('/me')).data;
      const r = await api('/u/' + encodeURIComponent(me.uid) + '/lists', { params: { limit: 30 } });
      const lists = r.data || [];
      root.querySelector('.sheet').innerHTML = `<div class="sheet-grab"></div><h3>Lists</h3>
        ${lists.length ? lists.map(l => `<a class="sheet-item" href="#/list/${encodeURIComponent(l.username || me.username)}/${encodeURIComponent(l.slug)}">
          ${esc(l.title)} <span style="color:var(--txt3);font-size:12px">· ${l.itemCount}</span></a>`).join('')
          : '<div class="empty" style="padding:20px">No public lists yet.</div>'}
        <div class="actions" style="padding:14px 0 0"><a class="btn primary" style="display:block;text-align:center"
          href="${site}" target="_blank">Add to a list on site</a></div>`;
    } catch (e){
      root.querySelector('.sheet').innerHTML = `<div class="sheet-grab"></div><h3>Lists</h3>${errCard(e)}`;
    }
  };
}

function lightbox(src, label){
  const el = document.createElement('div');
  el.className = 'lightbox';
  el.innerHTML = `<button class="lb-close">✕</button><img src="${esc(src)}" onerror="this.src='${PH}'"><div class="lb-ch">${esc(label || '')}</div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.querySelector('.lb-close').onclick = close;
  el.onclick = e => { if (e.target === el) close(); };
}

    </div>

  const host = $('#host');
  let type = 'tracking';

  const draw = async () => {
    host.innerHTML = '<div class="spin"></div>';
    if (type === 'me'){
      try {
        const { data } = await api('/me');
        host.innerHTML = `<div class="pad">

      } catch (e){ host.innerHTML = errCard(e); }
      return;

    host.innerHTML = '';

      const bar = document.createElement('div');
      bar.className = 'filters';

          <img class="thumb" src="${esc(img(x.pornhwa.coverImage))}" onerror="this.onerror=null;this.src='${PH}'">

          return w.firstElementChild; }, '<div class="empty">Library is empty.</div>');
      load();
      bar.querySelector('#sh').onchange = () => { host.querySelectorAll('.loadmore').forEach(n => n.remove());
        rows.innerHTML = ''; load(); };
    }

    if (type === 'ratings'){
      pager(host, p => api('/me/ratings', { params: { page: p, limit: 30 } }), x => {
        const w = document.createElement('div');
        w.innerHTML = `<a class="row" href="#/series/${encodeURIComponent(x.pornhwaSlug)}">

        return w.firstElementChild;
      }, '<div class="empty">No ratings.</div>');

  };
  draw();

const TABS = ['/', '/browse', '/search', '/library', '/more'];
function setTab(path){ document.querySelectorAll('#tabbar a').forEach(a => a.classList.toggle('on', a.dataset.tab === path)); }

async function route(){
  const raw = location.hash.slice(1) || '/';
  const [pathStr, queryStr] = raw.split('?');
  const q = new URLSearchParams(queryStr || '');
  const seg = pathStr.split('/').filter(Boolean).map(decodeURIComponent);
  const path = '/' + seg.join('/');

  setTab(path);
  if (!K.key && path !== '/settings') return vSetup();

  try {
    switch (seg[0]){
      case undefined: return vHome();
      case 'browse': return vBrowse(q);
      case 'search': return vSearch();
      case 'library': return vLibrary();
      case 'more': return vMore();
      case 'series': return vSeries(seg[1]);
      case 'character': return vCharacter(seg[1]);
      case 'creator': return vCreator(seg[1]);
      case 'lists': return vLists();
      case 'list': return vList(seg[1], seg[2]);
      case 'u': return vUser(seg[1]);
      case 'tags': return vTags();
      case 'chapters': return vChapters();
      case 'chapter': return vChapterTag(seg[1]);
      case 'reviews': return vReviews(q);
      case 'ratings': return vRatings();
      case 'leaderboard': return vLeaderboard();
      case 'stats': return vStats();
      case 'settings': return vSettings();
      default: return vHome();
    }
  } catch (e){ page(`${hdr('Error')}${errCard(e)}`); }
}

window.addEventListener('hashchange', route);
document.documentElement.dataset.theme = K.theme || '';
route();
