<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>PornhwaDB</title>
<style>
:root{
  --bg:#000; --bg2:#1c1c1e; --bg3:#2c2c2e; --bg4:#3a3a3c;
  --sep:rgba(84,84,88,.55); --txt:#fff; --txt2:rgba(235,235,245,.62); --txt3:rgba(235,235,245,.32);
  --blue:#0a84ff; --pink:#ff375f; --green:#30d158; --orange:#ff9f0a; --purple:#bf5af2;
  --r:12px; --tab:64px;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f2f2f7; --bg2:#fff; --bg3:#e9e9ee; --bg4:#dcdce2;
    --sep:rgba(60,60,67,.2); --txt:#000; --txt2:rgba(60,60,67,.6); --txt3:rgba(60,60,67,.3);
    --blue:#007aff; --pink:#ff2d55; --green:#34c759; --orange:#ff9500; --purple:#af52de;
  }
}
:root[data-theme="light"]{
  --bg:#f2f2f7; --bg2:#fff; --bg3:#e9e9ee; --bg4:#dcdce2;
  --sep:rgba(60,60,67,.2); --txt:#000; --txt2:rgba(60,60,67,.6); --txt3:rgba(60,60,67,.3);
  --blue:#007aff; --pink:#ff2d55; --green:#34c759; --orange:#ff9500; --purple:#af52de;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--txt);
  font:16px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
img{display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--bg3);border:0;border-radius:10px;padding:10px 12px;width:100%;outline:none;-webkit-appearance:none}
input::placeholder{color:var(--txt3)}
h1,h2,h3,h4,p{margin:0}

/* ---------- shell ---------- */
#app{min-height:100vh;padding-top:env(safe-area-inset-top)}
.large{padding:14px 16px 6px}
.large h1{font-size:34px;font-weight:800;letter-spacing:-.6px}
.hdr{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);
}
.hdr h1{font-size:17px;font-weight:600;flex:1;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .ico{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--blue);flex:0 0 auto}
.hdr .ico:active{background:var(--bg3)}
.hdr-r{width:34px;display:flex;justify-content:flex-end;flex:0 0 auto}
.pad{padding:12px 16px}
.sec{padding:18px 16px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sec-h h2{font-size:20px;font-weight:700;letter-spacing:-.3px}
.sec-h a{font-size:14px;color:var(--blue)}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  height:calc(var(--tab) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb, var(--bg) 80%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-top:.5px solid var(--sep);
}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10px;font-weight:500;color:var(--txt3)}
.tabbar a.on{color:var(--blue)}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px}
.hrow{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x mandatory;
  scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hrow .card{width:112px;flex:0 0 auto;scroll-snap-align:start}
.card{display:block}
.card-img{position:relative;aspect-ratio:3/4.3;border-radius:10px;overflow:hidden;background:var(--bg3)}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-title{font-size:12.5px;font-weight:600;line-height:1.25;margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:11px;color:var(--txt2);margin-top:2px}
.star{color:var(--orange)}
.badge{position:absolute;left:6px;top:6px;font-size:9.5px;font-weight:700;letter-spacing:.2px;
  padding:3px 6px;border-radius:6px;text-transform:uppercase;
  background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff}
.badge.ongoing{background:rgba(48,209,88,.9);color:#000}
.badge.completed{background:rgba(10,132,255,.9)}
.badge.hiatus{background:rgba(255,159,10,.92);color:#000}
.badge.orient{left:auto;right:6px;background:rgba(191,90,242,.9)}

/* ---------- rows ---------- */
.rows{background:var(--bg2);border-radius:var(--r);overflow:hidden;margin:0 16px}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border-bottom:.5px solid var(--sep)}
.row:last-child{border-bottom:0}
.row:active{background:var(--bg3)}
.row img.thumb{width:46px;height:64px;border-radius:7px;object-fit:cover;background:var(--bg3);flex:0 0 auto}
.row .rmain{flex:1;min-width:0}
.row .rtitle{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rsub{font-size:12.5px;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rright{font-size:13px;color:var(--txt2);flex:0 0 auto}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding:16px 16px 20px}
.hero-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;
  filter:blur(38px) saturate(1.5) brightness(.5);transform:scale(1.15)}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--bg) 12%,transparent 70%,var(--bg))}
.hero-in{position:relative;display:flex;gap:14px}
.hero-cover{width:118px;flex:0 0 auto;aspect-ratio:3/4.3;border-radius:12px;object-fit:cover;
  box-shadow:0 10px 30px rgba(0,0,0,.5);background:var(--bg3)}
.hero-meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.hero-meta h1{font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-.4px}
.hero-meta .sub{font-size:13px;color:var(--txt2)}
.tagline{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 4px}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--bg3);color:var(--txt2)}
.chip.blue{background:color-mix(in srgb,var(--blue) 22%,transparent);color:var(--blue)}
.chip.on{background:var(--blue);color:#fff}
.actions{display:flex;gap:8px;padding:14px 16px 4px}
.btn{flex:1;text-align:center;padding:11px;border-radius:11px;background:var(--bg3);
  font-size:14px;font-weight:600}
.btn.primary{background:var(--blue);color:#fff}
.btn.on{background:var(--pink);color:#fff}
.btn.danger{background:color-mix(in srgb,var(--pink) 20%,transparent);color:var(--pink)}
.btn:active{opacity:.7}
.desc{padding:10px 16px;font-size:14.5px;line-height:1.5;color:var(--txt2);white-space:pre-wrap}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{color:var(--blue);font-size:14px;padding:0 16px 8px;font-weight:600}

/* ---------- misc ---------- */
.stats-strip{display:flex;gap:8px;padding:8px 16px}
.stat{flex:1;background:var(--bg2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:17px}
.stat span{font-size:10.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--bg3);flex:0 0 auto}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px 8px;padding:0 16px}
.avcard{text-align:center}
.avcard img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;background:var(--bg3)}
.avcard span{display:block;font-size:11.5px;margin-top:5px;color:var(--txt2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sentinel{height:1px}
.loadmore{display:block;margin:18px auto;padding:11px 26px;border-radius:999px;
  background:var(--bg3);font-size:14px;font-weight:600;color:var(--txt2)}
.empty{text-align:center;padding:60px 30px;color:var(--txt3);font-size:14px}
.err{margin:14px 16px;padding:14px;border-radius:var(--r);background:var(--bg2);
  border-left:3px solid var(--pink);font-size:13.5px;color:var(--txt2)}
.err b{color:var(--txt);display:block;margin-bottom:4px}
.spin{width:22px;height:22px;border:2.5px solid var(--bg4);border-top-color:var(--blue);
  border-radius:50%;animation:sp .7s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;background:var(--bg3);border-radius:10px;padding:3px;margin:10px 16px}
.seg button{flex:1;padding:7px;border-radius:8px;font-size:13px;font-weight:600;color:var(--txt2)}
.seg button.on{background:var(--bg2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.filters{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select{width:auto;flex:0 0 auto;padding:8px 10px;font-size:13px;border-radius:9px}
.searchbar{padding:10px 16px}
.searchbar input{border-radius:11px;padding:11px 14px}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:.25s}
.sheet{position:relative;width:100%;max-height:82vh;overflow:auto;background:var(--bg2);
  border-radius:18px 18px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:.28s cubic-bezier(.2,.8,.3,1)}
.sheet-wrap.in .sheet{transform:none}
.sheet-wrap.in .sheet-backdrop{opacity:1}
.sheet-grab{width:36px;height:5px;border-radius:3px;background:var(--bg4);margin:6px auto 14px}
.sheet h3{font-size:18px;font-weight:700;margin-bottom:12px}
.sheet-item{display:block;width:100%;text-align:left;padding:13px 4px;
  border-bottom:.5px solid var(--sep);font-size:15.5px}
.sheet-item:active{color:var(--blue)}
.sheet-item.sel{color:var(--blue);font-weight:600}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + 22px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:200;background:var(--bg4);color:var(--txt);
  padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;
  pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--pink);color:#fff}

/* ---------- setup ---------- */
.setup{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:34px 26px}
.setup h1{font-size:30px;font-weight:800;letter-spacing:-.6px;margin-bottom:6px}
.setup p{color:var(--txt2);font-size:14px;margin-bottom:22px}
.setup label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;color:var(--txt3);margin:16px 0 6px}
.setup .btn{margin-top:22px;padding:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar">
  <a href="#/" data-tab="/"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>Home</a>
  <a href="#/browse" data-tab="/browse"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Browse</a>
  <a href="#/search" data-tab="/search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</a>
  <a href="#/library" data-tab="/library"><svg viewBox="0 0 24 24"><path d="M4 4h5v16H4z"/><path d="M11 4h4v16h-4z"/><path d="m17.5 5 3.5 14-3.5.9"/></svg>Library</a>
  <a href="#/more" data-tab="/more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>More</a>
</nav>
<div id="toast"></div>

<script>
/* ============================================================
   state / helpers
   ============================================================ */
const $ = s => document.querySelector(s);
const app = $('#app');
const SITE = 'https://pornhwadb.com';
const PH = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="430"><rect width="100%" height="100%" fill="#2c2c2e"/><text x="50%" y="50%" fill="#6a6a6e" font-family="sans-serif" font-size="19" text-anchor="middle">no cover</text></svg>');

const K = {
  get key(){ return localStorage.getItem('pwdb.key') || '' },
  set key(v){ v ? localStorage.setItem('pwdb.key', v) : localStorage.removeItem('pwdb.key') },
  get base(){ return (localStorage.getItem('pwdb.base') || SITE + '/api/v1').replace(/\/+$/,'') },
  set base(v){ localStorage.setItem('pwdb.base', (v || SITE + '/api/v1').replace(/\/+$/,'')) },
  get theme(){ return localStorage.getItem('pwdb.theme') || '' },
  set theme(v){ v ? localStorage.setItem('pwdb.theme', v) : localStorage.removeItem('pwdb.theme') }
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img = u => !u ? PH : (/^https?:/i.test(u) ? u : SITE + (u[0] === '/' ? '' : '/') + u);
const stars = v => v == null ? '—' : '★'.repeat(Math.round(v)) + '☆'.repeat(Math.max(0, 5 - Math.round(v))) + ' ' + v.toFixed(1);
const when = d => { if(!d) return ''; const t = new Date(d); const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago'; if (s < 2592000) return Math.floor(s/86400) + 'd ago';
  return t.toLocaleDateString(); };
const lblStatus = s => ({reading:'Reading', completed:'Completed', dropped:'Dropped',
  plan_to_read:'Plan to read', on_hold:'On hold', re_reading:'Re-reading'}[s] || s);
const clsStatus = s => s === 'On Going' ? 'ongoing' : s === 'Completed' ? 'completed' : s === 'Hiatus' ? 'hiatus' : '';

function toast(msg, bad){ const t = $('#toast'); t.textContent = msg; t.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = '', 2400); }

function errCard(e){
  const code = e?.code || (e?.status ? 'HTTP ' + e.status : 'NETWORK');
  let hint = '';
  if (code === 'MISSING_API_KEY' || code === 'INVALID_API_KEY') hint = 'Check your API key in Settings.';
  else if (code === 'RATE_LIMITED' || code === 'MUTATION_RATE_LIMITED') hint = 'Slow down and retry in a moment.';
  else if (code === 'NETWORK') hint = 'Could not reach the API. If the site blocks browser calls, point the base URL at your own proxy in Settings.';
  return `<div class="err"><b>${esc(code)}</b>${esc(e?.message || 'Request failed')}${hint ? '<br>' + esc(hint) : ''}</div>`;
}

/* ============================================================
   api client (ETag aware)
   ============================================================ */
const memCache = new Map();

async function api(path, opts = {}){
  const url = new URL(K.base + path);
  for (const k in (opts.params || {})){
    const v = opts.params[k];
    if (v === undefined || v === null || v === '') continue;
    if (Array.isArray(v)) v.forEach(x => url.searchParams.append(k, x));
    else url.searchParams.set(k, String(v));
  }
  const headers = Object.assign({}, opts.headers || {});
  if (K.key) headers['X-API-Key'] = K.key;

  const method = opts.method || 'GET';
  let cKey = null, cached = null;
  if (method === 'GET'){
    cKey = url.href;
    cached = memCache.get(cKey) || null;
    if (!cached){ try { cached = JSON.parse(localStorage.getItem('pwdb.c:' + cKey) || 'null'); } catch {} }
    if (cached?.etag) headers['If-None-Match'] = cached.etag;
  }

  let res;
  try {
    res = await fetch(url.href, {
      method, headers,
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
    });
  } catch (e) {
    const err = new Error('Network request failed'); err.code = 'NETWORK'; throw err;
  }

  if (res.status === 304 && cached) return cached.body;

  const text = await res.text();
  let body = null;
  if (text){ try { body = JSON.parse(text); } catch { body = { error: text.slice(0, 300) }; } }

  if (!res.ok){
    const err = new Error(body?.error || res.statusText || 'HTTP ' + res.status);
    err.status = res.status; err.code = body?.code || 'HTTP_' + res.status; err.body = body;
    throw err;
  }

  if (cKey && body){
    const etag = res.headers.get('ETag');
    if (etag){
      const rec = { etag, body };
      memCache.set(cKey, rec);
      try {
        localStorage.setItem('pwdb.c:' + cKey, JSON.stringify(rec));
        if (localStorage.length > 220){
          for (const k of Object.keys(localStorage)) if (k.startsWith('pwdb.c:')) { localStorage.removeItem(k); break; }
        }
      } catch {}
    }
  }
  return body;
}

/* ============================================================
   shell / router
   ============================================================ */
const scrollMem = new Map();

function page(html, { keepScroll = false } = {}){
  app.innerHTML = html;
  if (!keepScroll) window.scrollTo(0, 0);
}

function hdr(title, { right = '', back = true } = {}){
  return `<header class="hdr">
    ${back ? `<button class="ico" onclick="history.back()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>` : '<span class="ico"></span>'}
    <h1>${esc(title)}</h1>
    <span class="hdr-r">${right}</span>
  </header>`;
}

function openSheet(title, html){
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet-backdrop"></div><div class="sheet"><div class="sheet-grab"></div><h3>${esc(title)}</h3>${html}</div>`;
  document.body.appendChild(wrap);
  requestAnimationFrame(() => wrap.classList.add('in'));
  const close = () => { wrap.classList.remove('in'); setTimeout(() => wrap.remove(), 260); };
  wrap.querySelector('.sheet-backdrop').onclick = close;
  return { root: wrap, close };
}

function pager(target, fetchFn, renderFn, emptyHtml = '<div class="empty">Nothing here yet.</div>'){
  const list = document.createElement('div');
  target.appendChild(list);
  const more = document.createElement('button');
  more.className = 'loadmore'; more.textContent = 'Load more';
  target.appendChild(more);

  let p = 1, loading = false, done = false;
  const step = async () => {
    if (loading || done) return;
    loading = true; more.textContent = 'Loading…';
    try {
      const res = await fetchFn(p);
      const items = res?.data ?? [];
      items.forEach(it => { if (it) list.appendChild(renderFn(it)); });
      if (!items.length && p === 1) list.innerHTML = emptyHtml;
      done = !res?.pagination?.hasMore || p >= 1000;
      p++;
    } catch (e){
      list.insertAdjacentHTML('beforeend', errCard(e));
      done = true;
    }
    loading = false;
    if (done) more.remove(); else more.textContent = 'Load more';
  };
  more.onclick = step;
  const io = new IntersectionObserver(en => { if (en[0].isIntersecting) step(); }, { rootMargin: '700px' });
  io.observe(more);
  step();
  return { list, reload: () => { io.disconnect(); list.innerHTML = ''; } };
}

const seriesCard = s => `<a class="card" href="#/series/${encodeURIComponent(s.slug)}">
  <div class="card-img">
    <img loading="lazy" src="${esc(img(s.coverImage))}" onerror="this.onerror=null;this.src='${PH}'">
    ${s.status ? `<span class="badge ${clsStatus(s.status)}">${esc(s.status)}</span>` : ''}
    ${s.orientation ? `<span class="badge orient">${esc(s.orientation)}</span>` : ''}
  </div>
  <div class="card-title">${esc(s.title)}</div>
  <div class="card-meta">${s.averageRating != null ? `<span class="star">★</span> ${s.averageRating.toFixed(1)}` : ''}${s.totalChapters ? ` · ${s.totalChapters} ch` : ''}</div>

        <option value="release_year">Release year</option><option value="updated_at">Updated</option>
        <option value="created_at">Added</option></select>
      <select id="f-order"><option value="asc">Asc</option><option value="desc">Desc</option></select>

  $('#f-sort').value = params.sort;
  $('#f-order').value = params.order;

  const host = $('#host');
  host.innerHTML = '<div class="spin"></div>';

    params.status = $('#f-status').value; params.orientation = $('#f-orient').value;
    params.sort = $('#f-sort').value; params.order = $('#f-order').value;
    params.search = $('#q').value.trim();

      Object.entries(params).filter(([, v]) => v)).toString());
    host.innerHTML = '';

async function vSearch(){
  page(`${hdr('Search')}
    <div class="searchbar"><input id="q" placeholder="Series, characters, chapters, creators" autofocus></div>
    <div class="seg" id="seg">
      <button data-t="pornhwa" class="on">Series</button>
      <button data-t="character">Characters</button>
      <button data-t="chapter">Chapters</button>
      <button data-t="creator">Creators</button>
    </div>
    <div id="host"><div class="empty">Type to search the database.</div></div>`);

  let type = 'pornhwa';
  const host = $('#host');

  const run = () => {
    const q = $('#q').value.trim();
    host.innerHTML = '';
    if (!q) { host.innerHTML = '<div class="empty">Type to search the database.</div>'; return; }
    const grid = document.createElement('div');
    const rows = document.createElement('div'); rows.className = 'rows';
    host.appendChild(type === 'pornhwa' ? grid : rows);
    if (type === 'pornhwa') grid.className = 'grid';

    const fetcher = p => {
      if (type === 'pornhwa') return api('/search', { params: { q, type: 'pornhwa', page: p } }).then(r => ({ data: r.data?.pornhwa, pagination: r.pagination?.pornhwa }));
      if (type === 'character') return api('/search', { params: { q, type: 'character', page: p } }).then(r => ({ data: r.data?.characters, pagination: r.pagination?.characters }));
      if (type === 'chapter') return api('/chapters/search', { params: { tags: q, page: p } });
      return api('/creators', { params: { name: q, page: p } });
    };

    const render = it => {
      const w = document.createElement('div');
      if (type === 'pornhwa') w.innerHTML = seriesCard(it);
      else if (type === 'character') w.innerHTML = `<a class="row" href="#/character/${it.id}">
        <img class="thumb" src="${esc(img(it.image))}" onerror="this.onerror=null;this.src='${PH}'" style="width:46px;height:46px;border-radius:50%">
        <div class="rmain"><div class="rtitle">${esc(it.name)}</div><div class="rsub">${esc(it.pornhwa?.title || '')}</div></div></a>`;
      else if (type === 'chapter') w.innerHTML = `<a class="row" href="#/series/${encodeURIComponent(it.pornhwa?.slug || '')}">
        <img class="thumb" src="${esc(img(it.pornhwa?.coverImage))}" onerror="this.onerror=null;this.src='${PH}'">
        <div class="rmain"><div class="rtitle">${esc(it.pornhwa?.title || '')}</div>
        <div class="rsub">Ch. ${it.chapter?.chapterStart}${it.chapter?.chapterEnd ? '–' + it.chapter.chapterEnd : ''} · ${esc((it.chapter?.tags || []).join(', '))}</div></div></a>`;
      else w.innerHTML = `<a class="row" href="#/creator/${it.id}">
        <div class="rmain"><div class="rtitle">${esc(it.canonicalName || it.name)}</div>
        <div class="rsub">${esc((it.types || []).join(' · '))} · ${it.totalWorks} works</div></div></a>`;
      return w.firstElementChild;
    };
    pager(host, fetcher, render, '<div class="empty">No results.</div>');
  };

  $('#seg').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    [...$('#seg').children].forEach(x => x.classList.remove('on'));
    b.classList.add('on'); type = b.dataset.t; run();
  };
  let t; $('#q').oninput = () => { clearTimeout(t); t = setTimeout(run, 420); };
}

/* ============================================================
   router
   ============================================================ */
const TABS = ['/', '/browse', '/search', '/library', '/more'];

function setTab(path){
  document.querySelectorAll('#tabbar a').forEach(a => a.classList.toggle('on', a.dataset.tab === path));
}

async function route(){
  const raw = location.hash.slice(1) || '/';
  const [pathStr, queryStr] = raw.split('?');
  const q = new URLSearchParams(queryStr || '');
  const seg = pathStr.split('/').filter(Boolean).map(decodeURIComponent);
  const path = '/' + seg.join('/');

  setTab(path);
  if (!K.key && path !== '/settings') return vSetup();

  try {
    switch (seg[0]){
      case undefined: return vHome();
      case 'browse': return vBrowse(q);
      case 'search': return vSearch();
      case 'library': return vLibrary();
      case 'more': return vMore();
      case 'series': return vSeries(seg[1]);
      case 'character': return vCharacter(seg[1]);
      case 'creator': return vCreator(seg[1]);
      case 'lists': return vLists();
      case 'list': return vList(seg[1], seg[2]);
      case 'u': return vUser(seg[1]);
      case 'tags': return vTags();
      case 'chapters': return vChapters();
      case 'chapter': return vChapterTag(seg[1]);
      case 'reviews': return vReviews(q);
      case 'ratings': return vRatings();
      case 'leaderboard': return vLeaderboard();
      case 'stats': return vStats();
      case 'settings': return vSettings();
      case 'discover': {
        const map = { trending: 'trending', top: 'top-rated', updated: 'recently-updated', new: 'new' };
        return vHome();
      }
      default: return vHome();
    }
  } catch (e){
    page(`${hdr('Error')}${errCard(e)}`);
  }
}

window.addEventListener('hashchange', route);
document.documentElement.dataset.theme = K.theme || '';
route();
